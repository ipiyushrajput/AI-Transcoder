# Exact versions the test suites pass with on Python 3.10 (Ubuntu 22.04's
# python3). Install these on production servers so every server runs the same,
# tested set:
#
#     python3 -m venv .venv && . .venv/bin/activate
#     pip install -r requirements.lock
#
# requirements.txt keeps the version ranges. To move to newer versions: install
# from requirements.txt in a fresh venv, run tests/smoke_test.py and
# tests/pipeline_test.py, then regenerate this file with `pip freeze`.
